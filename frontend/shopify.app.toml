# Shopify app configuration. application_url is what Shopify actually loads
# as the embedded admin iframe src - that's this Remix frontend, NOT the
# Laravel backend (which only owns OAuth/webhooks/API, see
# backend/app/Http/Controllers/ShopifyOAuthController.php). redirect_urls
# stays pointed at the backend since that's where /auth/callback lives.
name = "SpeedPilot"
client_id = "18daa143e8994476086f856dd653dd3f"
application_url = "https://speedpilotfrontend-production.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_themes,write_themes,read_products,read_script_tags,write_script_tags"

[auth]
redirect_urls = ["https://speedpilot-production.up.railway.app/auth/callback"]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["themes/publish"]
  uri = "/webhooks/themes/publish"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

[build]
automatically_update_urls_on_dev = true
