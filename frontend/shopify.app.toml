# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "18daa143e8994476086f856dd653dd3f"
name = "SpeedPilot"
application_url = "https://speedpilotfrontend-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  # Absolute URLs, not relative paths - these handlers live on the Laravel
  # backend (see backend/routes/web.php), not on application_url (the
  # frontend), which is what a relative uri would resolve against.
  [[webhooks.subscriptions]]
  uri = "https://speedpilot-production.up.railway.app/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "https://speedpilot-production.up.railway.app/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://speedpilot-production.up.railway.app/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://speedpilot-production.up.railway.app/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "https://speedpilot-production.up.railway.app/webhooks/themes/publish"
  topics = [ "themes/publish" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_themes,write_themes,read_products,read_script_tags,write_script_tags"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://speedpilot-production.up.railway.app/auth/callback" ]
