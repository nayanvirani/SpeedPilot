# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "18daa143e8994476086f856dd653dd3f"
name = "SpeedPilot"
application_url = "https://speedpilot-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

# Storefront-facing, same-origin proxy - https://{shop}/apps/speedpilot/* is
# transparently forwarded here as /proxy/*. Exists specifically so a Service
# Worker can be registered same-origin with the storefront (a hard browser
# requirement) even though our app itself is hosted cross-origin on Railway.
[app_proxy]
url = "https://speedpilot-production.up.railway.app/proxy"
prefix = "apps"
subpath = "speedpilot"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "https://speedpilot-production.up.railway.app/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "https://speedpilot-production.up.railway.app/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://speedpilot-production.up.railway.app/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://speedpilot-production.up.railway.app/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "https://speedpilot-production.up.railway.app/webhooks/themes/publish"
  topics = [ "themes/publish" ]

  # Fires on every Shopify Managed Pricing plan change (subscribe, upgrade,
  # downgrade, cancel) - see AppSubscriptionsUpdateController.
  [[webhooks.subscriptions]]
  uri = "https://speedpilot-production.up.railway.app/webhooks/app_subscriptions/update"
  topics = [ "app_subscriptions/update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_themes,write_themes,read_products,read_script_tags,write_script_tags,read_content"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://speedpilot-production.up.railway.app/auth/callback" ]
